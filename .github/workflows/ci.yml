name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            apps/*/reports/
            packages/*/reports/
      - name: Observe the change
        if: ${{ !cancelled() }}
        env:
          PUTNAMI_CLOUD_TOKEN: ${{ secrets.PUTNAMI_CLOUD_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL https://putnami.dev/install.sh | bash -s -- --version canary
          export PATH="$HOME/.putnami/bin:$PATH"
          putnami extensions install --user @putnami/observe@canary
          putnami extensions install --user @putnami/cloud@canary
          putnami observe --evidence observe-evidence.json --upload --publish
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: observe-evidence
          path: observe-evidence.json

  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Pack @demo/pricing
        run: pnpm --filter @demo/pricing pack --pack-destination "$PWD/dist"
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/*.tgz
