name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            apps/*/reports/
            packages/*/reports/
      - name: Observe the change
        if: ${{ !cancelled() }}
        env:
          PUTNAMI_CLOUD_TOKEN: ${{ secrets.PUTNAMI_CLOUD_TOKEN }}
        run: |
          curl -fsSL https://putnami.dev/install.sh | bash -s -- --version canary
          export PATH="$HOME/.putnami/bin:$PATH"
          putnami extensions install --user @putnami/observe@canary
          putnami extensions install --user @putnami/cloud@canary
          putnami observe --evidence observe-evidence.json --upload
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: observe-evidence
          path: observe-evidence.json
      # Preview of putnami observe --publish (Putnami/putnami#762), built from
      # its branch until it reaches the canary channel. It runs twice: the
      # second run updates the note the first one wrote.
      - uses: actions/setup-go@v5
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        with:
          go-version: '1.26'
          cache: false
      - name: Publish the summary on the pull request
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --quiet --depth 1 --branch fdumay/759-observe-host-note https://github.com/Putnami/putnami "$RUNNER_TEMP/putnami"
          (cd "$RUNNER_TEMP/putnami/tooling/observe" && GOWORK=off go build -o "$RUNNER_TEMP/putnami-observe" ./cmd/putnami-observe)
          "$RUNNER_TEMP/putnami-observe" run --publish
          "$RUNNER_TEMP/putnami-observe" run --publish

  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Pack @demo/pricing
        run: pnpm --filter @demo/pricing pack --pack-destination "$PWD/dist"
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/*.tgz
